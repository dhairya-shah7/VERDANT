# ==============================================================================
# V.E.R.D.A.N.T. — Google Cloud Build Automated CI/CD Pipeline
# Built for Google Cloud & DeepMind Startup Buildathon 2026
# ==============================================================================

steps:
  # 1. Pull cache image to speed up builds
  - name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        docker pull ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO_NAME}/verdant-server:latest || exit 0

  # 2. Build Container Image with Layer Caching
  - name: 'gcr.io/cloud-builders/docker'
    args: [
      'build',
      '--cache-from', '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO_NAME}/verdant-server:latest',
      '-t', '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO_NAME}/verdant-server:$COMMIT_SHA',
      '-t', '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO_NAME}/verdant-server:latest',
      '.'
    ]

  # 3. Push Container Images to Google Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO_NAME}/verdant-server:$COMMIT_SHA']

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO_NAME}/verdant-server:latest']

  # 4. Deploy to Google Cloud Run (Serverless, Green Datacenter, Zero-Scale)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'verdant-server'
      - '--image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO_NAME}/verdant-server:$COMMIT_SHA'
      - '--region=${_REGION}'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--port=8000'
      - '--cpu=2'
      - '--memory=2Gi'
      - '--min-instances=0'
      - '--max-instances=10'
      - '--timeout=300'
      - '--set-env-vars=GCP_PROJECT=$PROJECT_ID,GCP_REGION=${_REGION},ENVIRONMENT=production,VERTEX_AI_ENABLED=true'

images:
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO_NAME}/verdant-server:$COMMIT_SHA'
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO_NAME}/verdant-server:latest'

substitutions:
  _REGION: 'us-central1'
  _REPO_NAME: 'verdant-repo'

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'
