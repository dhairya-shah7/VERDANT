<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>V.E.R.D.A.N.T.</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <div class="header">
      <div class="logo-box">
        <span class="icon">🌱</span>
        <div>
          <div class="title">V.E.R.D.A.N.T.</div>
          <div class="subtitle">Autonomous Bug Runtime</div>
        </div>
      </div>
      <div id="status-pill" class="badge badge-green">Connected</div>
    </div>

    <div class="actions-grid">
      <button id="btn-inspect-element" class="btn btn-secondary">
        🔍 Inspect Element
      </button>
      <button id="btn-analyze-active" class="btn btn-primary">
        ⚡ Analyze Tab
      </button>
    </div>

    <div class="section-title">ACTIVE TAB SCOPE</div>
    <div id="buffer-summary" class="buffer-box">
      Monitoring active page only. Captures DOM geometry, layout overflows, and console errors.
    </div>

    <div class="footer">
      <a href="http://localhost:8000" target="_blank" class="footer-link">Open Central Portal ↗</a>
      <span style="font-weight:600;">v2.4.0</span>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
