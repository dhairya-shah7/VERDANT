name: V.E.R.D.A.N.T. Autonomous Self-Healing Sentinel

on:
  pull_request:
    branches: [main, master, staging]
  workflow_dispatch:
    inputs:
      target_url:
        description: 'URL to audit'
        required: false
        default: 'http://localhost:8000'

jobs:
  autonomous-sentinel:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install chromium --with-deps

      - name: Run Autonomous Sentinel Audit & Self-Heal
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python verdant-sentinel/cli.py --url ${{ github.event.inputs.target_url || 'http://localhost:8000' }}

      - name: Commit Self-Healed Fixes & Reproducer Tests
        if: success()
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "fix(autofix): self-healed layout/runtime defect verified by V.E.R.D.A.N.T."
          file_pattern: "src/* tests/reproducers/*"
